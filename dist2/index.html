<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech-Brain Agent</title>

    <script>
      (function() {
        try {
          // 读取您之前存在本地的主题配置
          const theme = localStorage.getItem('tech-brain-theme');
          
          // 如果是暗黑模式，直接在最顶层的 html 标签上打上 dark 标记
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
